<form>
  <fieldset>
    <legend>User personal information</legend>

    <label for="fullname">Enter your full name</label><br>
    <input type="text" id="fullname" name="fullname" value="Rahul Kumar"><br><br>

    <label for="email">Enter your email</label><br>
    <input type="email" id="email" name="email" value="geeks@12345gmail.com"><br><br>

    <label for="password">Enter your password</label><br>
    <input type="password" id="password" name="password"><br><br>

    <label for="confirm_password">Confirm your password</label><br>
    <input type="password" id="confirm_password" name="confirm_password"><br><br>

    <label>Enter your gender</label><br>
    <input type="radio" id="male" name="gender" value="male" checked>
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>
    <input type="radio" id="others" name="gender" value="others">
    <label for="others">Others</label><br><br>

    <label for="dob">Enter your Date of Birth</label><br>
    <input type="date" id="dob" name="dob" value="2009-06-10"><br><br>

    <label for="address">Enter your Address:</label><br>
    <textarea id="address" name="address" rows="3" cols="30">Noida Sector 137</textarea><br><br>

    <input type="submit" value="submit">
  </fieldset>
</form>
