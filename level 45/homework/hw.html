def boolean_to_string(b):
    return str(b)

<!-- 2 -->
 def maps(a):
    return [x * 2 for x in a]

<!-- 3 -->
 def add_binary(a, b):
    return bin(a + b)[2:]

<!-- 4 -->
 def validate_pin(pin):
    return len(pin) in (4, 6) and pin.isdigit()

<!-- 5 -->
 def binary_array_to_number(arr):
    return int("".join(str(x) for x in arr), 2)
