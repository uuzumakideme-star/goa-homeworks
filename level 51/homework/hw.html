
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Cards -->
    <section class="cards">
        <div class="card">
            <h2>Card 1</h2>
            <p>This is the first card.</p>
            <button>Read More</button>
        </div>

        <div class="card">
            <h2>Card 2</h2>
            <p>This is the second card.</p>
            <button>Read More</button>
        </div>

        <div class="card">
            <h2>Card 3</h2>
            <p>This is the third card.</p>
            <button>Read More</button>
        </div>
    </section>

    <!-- 2. Navigation Bar -->
    <nav class="navbar">
        <h2>MyLogo</h2>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Services</li>
            <li>Contact</li>
        </ul>
    </nav>

    <!-- 3. Gallery -->
    <section class="gallery">
        <img src="https://picsum.photos/id/10/300/200">
        <img src="https://picsum.photos/id/11/300/200">
        <img src="https://picsum.photos/id/12/300/200">
        <img src="https://picsum.photos/id/13/300/200">
        <img src="https://picsum.photos/id/14/300/200">
        <img src="https://picsum.photos/id/15/300/200">
    </section>

    <!-- 4. Profile Card -->
    <section class="profile">
        <img src="https://picsum.photos/200" alt="Profile">
        <div>
            <h2>John Smith</h2>
            <p>Hello! I am a web designer.</p>
            <button>Follow</button>
        </div>
    </section>

    <!-- 5. Hero Section -->
    <section class="hero">
        <div>
            <h1>Welcome to My Website!</h1>
            <p>Discover new things and enjoy your visit.</p>
            <button>Learn More</button>
        </div>
        <img src="https://picsum.photos/500/350" alt="Website image">
    </section>

</body>
</html>
