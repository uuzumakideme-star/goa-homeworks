<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>სარეგისტრაციო ფორმა</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .register-form {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        /* ზოგადი სტილი ყველა ინფუთისთვის */
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        /* 1. სრული სახელის ინფუთის გასტილვა ატრიბუტ სელექტორით */
        input[type="text"] {
            border-color: #4CAF50;
            border-radius: 5px; /* გამოყენებულია border-radius */
            background-color: #f9fff9;
        }

        /* 2. Gmail-ის ინფუთის გასტილვა ატრიბუტ სელექტორით */
        input[type="email"] {
            border-color: #2196F3;
            border-radius: 8px; /* გამოყენებულია border-radius */
            background-color: #f0f8ff;
        }

        /* 3. პაროლის ინფუთის გასტილვა ატრიბუტ სელექტორით */
        input[type="password"] {
            border-color: #ff9800;
            border-radius: 5px; /* გამოყენებულია border-radius */
            background-color: #fffaf0;
        }

        /* რეგისტრაციის ღილაკის სტილი */
        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #04AA6D;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #038e5b;
        }
    </style>
</head>
<body>

    <form class="register-form">
        <h2>რეგისტრაცია</h2>
        
        <div class="form-group">
            <label for="fullname">სრული სახელი:</label>
            <input type="text" id="fullname" placeholder="შეიყვანეთ სახელი და გვარი" required>
        </div>

        <div class="form-group">
            <label for="email">Gmail-ი:</label>
            <input type="email" id="email" placeholder="example@gmail.com" required>
        </div>

        <div class="form-group">
            <label for="password">პაროლი:</label>
            <input type="password" id="password" placeholder="შეიყვანეთ პაროლი" required>
        </div>

        <button type="submit">რეგისტრაცია</button>
    </form>

</body>
</html>
