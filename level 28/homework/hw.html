<!-- 
  ======================================================================
  DIV (Division) - Block-level ელემენტი
  ======================================================================
  1. დანიშნულება: გამოიყენება ვებ-გვერდის სტრუქტურული ბლოკების/სექციების 
     დასახგუფებლად (მაგ: კონტეინერები, ბარათები, ნავიგაციის ზოლი).
  2. ქცევა: იკავებს მშობელი ელემენტის მთლიან სიგანეს (100%) და იწყება 
     ახალი ხაზიდან.
  3. გამოყენება: ძირითადად გამოიყენება დიდი კონტენტის დასაჯგუფებლად და 
     CSS-ის საშუალებით გვერდის განლაგების (layout) გასასწორებლად.

  ======================================================================
  SPAN - Inline ელემენტი
  ======================================================================
  1. დანიშნულება: გამოიყენება ტექსტის კონკრეტული ნაწილის ან მცირე 
     ფრაგმენტის დასაჯგუფებლად ხაზის შიგნით.
  2. ქცევა: იკავებს მხოლოდ იმ სიგანეს, რაც სჭირდება მის შიგნით არსებულ 
     კონტენტს. არ იწყებს ახალ ხაზს.
  3. გამოყენება: გამოიყენება ტექსტში ცალკეული სიტყვების გასაფერადებლად, 
     ფონტის შესაცვლელად ან სპეციფიკური სტილის მისანიჭებლად.
-->


<!--2-->

<!-- 
  ======================================================================
  BLOCK-LEVEL ელემენტები (მაგ: <div>, <p>, <h1>-<h6>, <section>, <ul>)
  ======================================================================
  1. ყოველთვის იწყებიან ახალი ხაზიდან.
  2. ავტომატურად იკავებენ ხელმისაწვდომი სიგანის 100%-ს.
  3. შესაძლებელია მითითება: width, height, margin და padding (ოთხივე მხარეს).
  4. გამოიყენება გვერდის ძირითადი სტრუქტურის ასაგებად.

  ======================================================================
  INLINE ელემენტები (მაგ: <span>, <a>, <b>, <i>, <img>, <strong>)
  ======================================================================
  1. არ იწყებიან ახალი ხაზიდან (განთავსდებიან გვერდიგვერდ იმავე ხაზზე).
  2. იკავებენ მხოლოდ კონტენტისთვის საჭირო სიგანესა და სიმაღლეს.
  3. არ მოქმედებს: width და height (სიგანისა და სიმაღლის ცვლილება).
  4. margin და padding მოქმედებს მხოლოდ ჰორიზონტალურად (მარცხნივ/მარჯვნივ).
-->


<!--3-->

<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>HTML/CSS დავალება</title>
    <style>
        /* 1-ლი DIV ბლოკი: მარტო ლინკები */
        .links-block {
            color: blue;
            background-color: #e3f2fd;
            text-align: center;
            font-size: 18px;
            border: 2px solid #2196f3;
            display: block;
            padding: 15px;
            margin-bottom: 20px;
        }

        .links-block a {
            color: #0d47a1;
            margin: 0 10px;
        }

        /* 2-რე DIV ბლოკი: მარტო ტექსტები */
        .text-block {
            color: #2c3e50;
            background-color: #f8f9fa;
            text-align: justify;
            font-size: 16px;
            border: 2px dashed #6c757d;
            display: block;
            padding: 15px;
            margin-bottom: 20px;
        }

        /* 3-რე DIV ბლოკი: მარტო სურათები */
        .image-block {
            color: #333333;
            background-color: #fff3cd;
            text-align: right;
            font-size: 14px;
            border: 3px double #ffc107;
            display: block;
            padding: 15px;
        }

        .image-block img {
            width: 150px;
            height: auto;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <!-- პირველი DIV ბლოკი: მხოლოდ ლინკები -->
    <div class="links-block">
        <a href="https://google.com" target="_blank">Google</a>
        <a href="https://youtube.com" target="_blank">YouTube</a>
        <a href="https://github.com" target="_blank">GitHub</a>
    </div>

    <!-- მეორე DIV ბლოკი: მხოლოდ ტექსტები -->
    <div class="text-block">
        <h2>სათაური ტექსტურ ბლოკში</h2>
        <p>ეს არის პირველი აბზაცი, სადაც განთავსებულია მხოლოდ ტექსტური ინფორმაცია.</p>
        <p>ეს არის მეორე აბზაცი. აქ გამოიყენება CSS-ის text-align, color და font-size კუთვნილებები.</p>
    </div>

    <!-- მესამე DIV ბლოკი: მხოლოდ სურათები -->
    <div class="image-block">
        <img src="https://via.placeholder.com/150/ff7f7f" alt="სურათი 1">
        <img src="https://via.placeholder.com/150/7fbf7f" alt="სურათი 2">
        <img src="https://via.placeholder.com/150/7f7fff" alt="სურათი 3">
    </div>

</body>
</html>
