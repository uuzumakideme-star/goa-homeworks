#1

<!-- Block-level მაგალითები: div, p, h1 -->
<div>ეს არის div (Block)</div>
<p style="display: inline;">ეს არის p (იყო Block, ახლა გახდა Inline)</p>
<h1>ეს არის h1 (Block)</h1>

<br>

<!-- Inline მაგალითები: span, a, button -->
<span style="display: block;">ეს არის span (იყო Inline, ახლა გახდა Block)</span>
<a href="#">ეს არის ბმული a (Inline)</a>
<button>ეს არის button (Inline)</button>

#2

<!-- პირველი ბლოკი: მხოლოდ ტექსტები -->
<div style="border: 2px solid red; background-color: #ffe6e6; color: darkred;">
    <h1>მთავარი სათაური</h1>
    <p>ეს არის პარაგრაფის ტექსტი პირველ დივ ბლოკში.</p>
</div>

<!-- მეორე ბლოკი: მხოლოდ ღილაკები -->
<div style="border: 2px solid blue; background-color: #e6f2ff; color: darkblue;">
    <button>პირველი ღილაკი</button>
    <button>მეორე ღილაკი</button>
</div>
