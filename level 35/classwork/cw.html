<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
</head>
<body>

  <div class="product-card">
    <!-- სურათის ბლოკი -->
    <div class="card-image-wrapper">
      <img src="https://media.discordapp.net/attachments/1522152854465417216/1552381269952696371/image.png?ex=6ab56738&is=6ab415b8&hm=5b0054f75d5fa0d10b0ae82b572afa759736ba95943cff40a4e6d832f620c35b&=&format=webp&quality=lossless" 
      alt="Nike Air MX Super 2500 - Red">
      
      <!-- კურსორის/ხელის იკონკა სურათის ცენტრში -->
      <div class="pointer-icon"></div>
    </div>

    <!-- ბარათის ტექსტური ნაწილი -->
    <div class="card-content">
      <h3 class="product-title">Nike Air MX Super 2500 - Red</h3>
      
      <div class="price-wrapper">
        <span class="current-price">$449</span>
      </div>

      <button class="add-to-cart-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" 
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" 
        stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        Add to cart
      </button>
    </div>
  </div>

</body>
</html>
