 def adjacent_element_product(array): 
     # ვიღებთ პირველი ორი ელემენტის ნამრავლს საწყის მაქსიმუმად
     max_product = array[0] * array[1]
    
     # გადავუვლით მასივს მეორე ელემენტიდან ბოლომდე
     for i in range(1, len(array) - 1):
         current_product = array[i] * array[i + 1]
         if current_product > max_product:
            max_product = current_product
            
     return max_product
