<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Box Model ექსპერიმენტი</title>
    <style>
        /* 
           CSS Box Model (ბოქს მოდელი) შედგება 4 ძირითადი ნაწილისგან:
           1. Content (შინაარსი)
           2. Padding (შიდა დაშორება)
           3. Border (ჩარჩო)
           4. Margin (გარე დაშორება)
        */

        /* მშობელი ბლოკი */
        .parent {
            width: 400px;
            height: 300px;
            background-color: #e0e0e0;
            border: 4px solid #333333; /* BORDER: ელემენტის ჩარჩო */
            
            padding: 20px; /* PADDING: შიდა დაშორება ჩარჩოსა და შვილ ბლოკს შორის */
            margin: 50px auto; /* MARGIN: გარე დაშორება აშორებს მშობელ ბლოკს ეკრანის ზედა ნაწილიდან და ცენტრავს გვერდულად */
            
            position: relative; /* საჭიროა შვილი ბლოკის bottom თვისების სწორად სამუშაოდ */
        }

        /* შვილი ბლოკი */
        .child {
            width: 150px;
            height: 100px;
            background-color: #4CAF50;
            border: 2px solid #1b5e20;
            
            /* CONTENT: ტექსტი "შვილი ბლოკი" განთავსებულია შიგნით */
            color: white;
            padding: 10px; /* შიდა დაშორება ტექსტსა და შვილი ბლოკის ჩარჩოს შორის */
            
            position: absolute; 
            bottom: 20px; /* BOTTOM: აწევს შვილ ბლოკს მშობლის ქვედა საზღვრიდან 20 პიქსელით მაღლა */
            
            margin-left: 10px; /* MARGIN: დამატებითი გარე დაშორება მარცხნიდან */
        }
    </style>
</head>
<body>

    <div class="parent">
        მშობელი ბლოკი
        <div class="child">
            შვილი ბლოკი
        </div>
    </div>

</body>
</html>
