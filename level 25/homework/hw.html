<h2 align="center">Contact Details</h2>

<form>
  <fieldset>
    <p>Please enter your personal details:</p>
    
    <label for="fname"><u>F</u>irst name:*</label>
    <input type="text" id="fname" name="fname" accesskey="f" required><br><br>

    <label for="lname"><u>L</u>ast name:*</label>
    <input type="text" id="lname" name="lname" accesskey="l" required><br><br>

    <label for="address">Street <u>a</u>ddress:</label>
    <input type="text" id="address" name="address" accesskey="a" size="40"><br><br>

    <label for="city"><u>T</u>own/city:</label>
    <input type="text" id="city" name="city" accesskey="t"><br><br>

    <label for="postcode">Post<u>c</u>ode/zip:</label>
    <input type="text" id="postcode" name="postcode" accesskey="c" size="10"><br><br>

    <label for="tel">Te<u>l</u>ephone:</label>
    <input type="tel" id="tel" name="tel" accesskey="l"><br><br>

    <label for="mobile"><u>M</u>obile:</label>
    <input type="tel" id="mobile" name="mobile" accesskey="m"><br><br>

    <label for="email"><u>E</u>mail address:*</label>
    <input type="email" id="email" name="email" accesskey="e" size="40" required><br><br>

    <p align="center">Fields marked * are required.</p>
    
    <div align="center">
      <input type="submit" value="Submit" accesskey="s">
    </div>
  </fieldset>
</form>
